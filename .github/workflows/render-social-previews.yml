name: Render portfolio social previews
on:
  push:
    branches: [main]
    paths:
      - 'assets/img/social-*.svg'
      - '.github/workflows/render-social-previews.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: social-preview-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CairoSVG
        run: python -m pip install --disable-pip-version-check cairosvg
      - name: Render full-size PNG cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          for source in Path('assets/img').glob('social-*.svg'):
              dest=source.with_suffix('.png')
              cairosvg.svg2png(url=str(source),write_to=str(dest),output_width=1200,output_height=630)
              assert dest.stat().st_size > 1000
              print(dest)
          PY
      - name: Publish preview graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/social-*.png
          if ! git diff --cached --quiet; then
            git commit -m "Render social preview PNGs [skip ci]"
            git push
          fi
