name: Inspect historical Juniper source archive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify historical ZIP integrity without publication
        run: |
          set -euo pipefail
          unzip -t assets/files/JuniperVale_Transformation_Lab_Source.zip | tail -n 2
          echo "The browsable juniper-command-center/ directory is authoritative."
          echo "The archive is refreshed through the controlled Juniper release workflow."
